name: tests

# Evidencia independiente de que la suite pasa. Antes de esto, cualquier
# afirmacion de "N pruebas verdes" era un resultado local reportado, imposible
# de verificar por un auditor externo.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Una sola version, a diferencia del repo de Redes. requirements.txt
      # esta clavado a numpy==1.26.4, que no publica ruedas mas alla de
      # cp312: en 3.13 pip intenta compilarlo desde fuente y la instalacion
      # se cae. Subir la version de Python aqui exige antes mover ese pin.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Se invoca como "python -m pytest", NO como "pytest" a secas. Las
      # pruebas importan el modulo con "import app", y como tests/ no tiene
      # __init__.py, pytest solo agrega tests/ a sys.path -- el directorio del
      # repo entra unicamente por el -m. Con "pytest" pelado, la recoleccion
      # revienta con ModuleNotFoundError. No simplificar esta linea.
      - name: Correr pruebas
        run: python -m pytest tests -q
