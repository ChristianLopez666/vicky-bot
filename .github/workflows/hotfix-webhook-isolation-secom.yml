name: SECOM webhook isolation hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hotfix-webhook-isolation-secom.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Aplicar guardia phone_number_id
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app.py")
          src = path.read_text(encoding="utf-8")
          old = '''        entry = (payload.get("entry") or [{}])[0]\n        changes = (entry.get("changes") or [{}])[0]\n        value = changes.get("value", {})\n        messages = value.get("messages", [])\n        statuses = value.get("statuses", [])\n'''
          new = '''        # Aislamiento por numero de WhatsApp: Meta entrega eventos a nivel WABA,\n        # por lo que este servicio puede recibir cambios de otros numeros de la\n        # misma cuenta. Solo SECOM debe producir efectos comerciales aqui.\n        local_values = []\n        for entry in payload.get("entry") or []:\n            for change in entry.get("changes") or []:\n                value = change.get("value") or {}\n                metadata = value.get("metadata") or {}\n                incoming_phone_id = str(metadata.get("phone_number_id") or "").strip()\n\n                if WABA_PHONE_ID:\n                    if incoming_phone_id and incoming_phone_id != WABA_PHONE_ID:\n                        log.info(\n                            "🧱 Webhook descartado por phone_number_id ajeno: recibido=%s esperado=%s",\n                            incoming_phone_id, WABA_PHONE_ID,\n                        )\n                        continue\n                else:\n                    log.error(\n                        "❌ WABA_PHONE_ID no configurado: aislamiento webhook degradado; "\n                        "procesando evento en modo legacy"\n                    )\n\n                if not incoming_phone_id:\n                    log.warning(\n                        "⚠️ Webhook sin metadata.phone_number_id; procesando por compatibilidad"\n                    )\n\n                local_values.append(value)\n\n        if not local_values:\n            log.info(\n                "🧱 Webhook sin eventos propios de SECOM; HTTP 200 sin procesamiento comercial"\n            )\n            return jsonify({"ok": True}), 200\n\n        messages = [\n            msg\n            for value in local_values\n            for msg in (value.get("messages") or [])\n        ]\n        statuses = [\n            st\n            for value in local_values\n            for st in (value.get("statuses") or [])\n        ]\n'''
          if "Webhook descartado por phone_number_id ajeno" not in src:
              if old not in src:
                  raise SystemExit("BLOQUE_OBJETIVO_NO_ENCONTRADO")
              src = src.replace(old, new, 1)
              path.write_text(src, encoding="utf-8")
          PY

      - name: Verificar sintaxis
        run: python -m py_compile app.py

      - name: Probar aislamiento SECOM
        shell: bash
        env:
          WABA_PHONE_ID: "1045543821971905"
          BOARDROOM_ENABLED: "false"
        run: |
          python - <<'PY'
          import app
          app.match_client_in_sheets = lambda *_: None
          app.BOARDROOM_IS_AUTHORITY = True
          handled = []
          app._handle_boardroom_authority = lambda *args, **kwargs: handled.append(args) or True
          client = app.app.test_client()

          def payload(phone_id, mid="wamid.test"):
              return {"entry": [{"changes": [{"value": {
                  "metadata": {"phone_number_id": phone_id},
                  "messages": [{"from": "5216681620521", "id": mid, "type": "text", "text": {"body": "vida"}}],
              }}]}]}

          assert client.post("/webhook", json=payload("702222712983984", "redes")).status_code == 200
          assert handled == []
          assert client.post("/webhook", json=payload("876953768824165", "rodys")).status_code == 200
          assert handled == []
          assert client.post("/webhook", json=payload("1045543821971905", "secom")).status_code == 200
          assert len(handled) == 1

          mixed = {"entry": [{"changes": [
              {"value": {"metadata": {"phone_number_id": "702222712983984"}, "messages": [{"from": "5211111111111", "id": "foreign", "type": "text", "text": {"body": "hola"}}]}},
              {"value": {"metadata": {"phone_number_id": "1045543821971905"}, "messages": [{"from": "5216681620521", "id": "own", "type": "text", "text": {"body": "vida"}}]}},
          ]}]}
          assert client.post("/webhook", json=mixed).status_code == 200
          assert len(handled) == 2
          print("SECOM isolation tests: OK")
          PY

      - name: Ejecutar regresion disponible
        run: python -m pytest tests -q --ignore=tests/test_cierre_cortesia_post_cuestionario.py

      - name: Commit de la correccion y limpieza del workflow temporal
        shell: bash
        run: |
          git config user.name "ChatGPT Webhook Isolation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/hotfix-webhook-isolation-secom.yml
          git add app.py
          git commit -m "fix(secom): aislar webhook por phone_number_id"
          git push origin main
